name: MBSE App CI

on:
  push:
    branches:
      - main
      - feature/web-chat-ui
      - feature/oa-viewpoint-dockable-layout
      - feature/oa-usability-refinement-fixes
      - feature/model-file-save-load
  pull_request:
    branches:
      - main
  workflow_dispatch:

jobs:
  tests:
    name: Tests - ${{ matrix.os }}
    runs-on: ${{ matrix.os }}

    strategy:
      fail-fast: false
      matrix:
        os:
          - ubuntu-latest
          - windows-latest
        python-version:
          - "3.12"

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python-version }}
          cache: pip

      - name: Upgrade pip
        run: python -m pip install --upgrade pip

      - name: Install application dependencies
        run: pip install -r requirements.txt

      - name: Install test dependencies
        run: pip install pytest

      - name: Run tests
        run: python -m pytest -q

  e2e:
    name: Web UI E2E - Chromium
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip

      - name: Upgrade pip
        run: python -m pip install --upgrade pip

      - name: Install application and E2E dependencies
        run: |
          pip install -r requirements.txt
          pip install pytest playwright

      - name: Install Chromium
        run: python -m playwright install --with-deps chromium

      - name: Run Playwright end-to-end test
        env:
          RUN_E2E: "1"
        run: python -m pytest -q tests/e2e/test_web_ui_e2e.py
