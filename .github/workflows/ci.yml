name: MBSE App CI (Manual)

on:
  workflow_dispatch:
    inputs:
      profile:
        description: "Remote verification profile"
        required: true
        default: "linux-tests"
        type: choice
        options:
          - linux-tests
          - cross-platform
          - sysml
          - e2e
          - full

concurrency:
  group: mbse-ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

env:
  PYTHONPATH: ${{ github.workspace }}

jobs:
  sysml-contract:
    if: ${{ inputs.profile == 'sysml' || inputs.profile == 'full' }}
    name: ArcadiaOA / SysML v2 contract
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip

      - name: Install test dependencies
        run: |
          python -m pip install --upgrade pip
          pip install pytest

      - name: Validate Python syntax
        run: python -m py_compile arcadia_oa_library.py sysml_v2.py sysml_level1.py web_app.py

      - name: Test ArcadiaOA-only translation contract
        run: python -m pytest -q tests/test_sysml_v2.py tests/test_sysml_level1.py tests/test_sysml_v2_ui_contract.py

  linux-tests:
    if: ${{ inputs.profile == 'linux-tests' }}
    name: Tests - Ubuntu
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt
          pip install pytest

      - name: Run tests
        run: python -m pytest -q

  cross-platform:
    if: ${{ inputs.profile == 'cross-platform' || inputs.profile == 'full' }}
    name: Tests - ${{ matrix.os }}
    runs-on: ${{ matrix.os }}

    strategy:
      fail-fast: false
      matrix:
        os:
          - ubuntu-latest
          - windows-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt
          pip install pytest

      - name: Validate local module resolution
        run: python -c "import sam_connection, sam_level1_sync, sam_level1_transactional, sam_level1_incremental; print(sam_connection.__file__); print(sam_level1_sync.__file__); print(sam_level1_transactional.__file__); print(sam_level1_incremental.__file__)"

      - name: Run tests
        run: python -m pytest -q

  e2e:
    if: ${{ inputs.profile == 'e2e' || inputs.profile == 'full' }}
    name: Web UI E2E - Chromium
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip

      - name: Install application and E2E dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt
          pip install pytest playwright

      - name: Install Chromium
        run: python -m playwright install --with-deps chromium

      - name: Run Playwright end-to-end tests
        env:
          RUN_E2E: "1"
        run: python -m pytest -q tests/e2e
